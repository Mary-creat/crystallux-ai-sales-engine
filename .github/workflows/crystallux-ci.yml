# ================================================================
# Crystallux Universal AI Sales Engine — CI/CD
# ================================================================
# Two jobs:
#
#   validate — runs on every push and PR. Parses every workflow JSON
#     in the estate (all 326, not just the top-level 50), then runs
#     the two validators the repo already ships.
#
#   deploy — runs only on push to main, and only for workflow files
#     that actually changed in that push. Updates in place by id.
#     It never creates and it never activates.
#
# Why deploy only updates: n8n's POST /workflows CREATES. The previous
# version of this file POSTed all 50 top-level workflows on every push
# to main, which is a duplicate-workflow generator — n8n assigns a new
# id each time and the old copy keeps running. That is the mechanism
# behind the six surplus DevOps briefing workflows in production
# (docs/audit/blockers.md §0n). 324 of 326 workflows carry a stable
# top-level id, so update-by-id is well defined; a blind create is not.
#
# First import of a genuinely new workflow stays a deliberate act via
# scripts/n8n/ship.sh, which sets the chosen id through the n8n CLI.
# CI has no docker access to the VPS and cannot do that.
#
# Activation is never automated — it is per-client, per-tier, and
# Mary's call (CLAUDE.md, dormant-by-default policy). The PUT body
# carries name/nodes/connections/settings only, so a workflow's live
# active state survives a deploy untouched.
# ================================================================

name: Crystallux CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Update every workflow in the repo, not just changed ones'
        type: boolean
        default: false
      allow_protected:
        description: 'Permit updates to the 9 protected production workflows'
        type: boolean
        default: false
      files:
        description: 'Space-separated workflow paths to deploy. Empty = changed files only.'
        type: string
        default: ''

jobs:

  # ── Job 0: is what runs what we think runs? ─────────────────────
  # Three protected deploys reported success while live behaviour
  # disagreed, and every diagnosis was an inference from column values --
  # one of which was wrong. CI holds a working n8n key, so it can answer
  # the question directly. Each workflow is its own step, so the per-step
  # conclusion says which file drifted without anyone reading a log.
  # Never blocks the pipeline: it reports, it does not gate.
  live-drift:
    name: Live n8n vs repo
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lead Research v2 matches live
        continue-on-error: true
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: python scripts/n8n/compare-live-vs-repo.py workflows/clx-lead-research-v2.json

      - name: Lead Scoring v2 matches live
        continue-on-error: true
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: python scripts/n8n/compare-live-vs-repo.py workflows/clx-lead-scoring-v2.json

      - name: Agent decision engine matches live
        continue-on-error: true
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: python scripts/n8n/compare-live-vs-repo.py workflows/api/agent/clx-agent-decision-engine-v1.json

  # ── Job 1: Validate ─────────────────────────────────────────────
  validate:
    name: Validate workflow + migration estate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # validate-workflows.py shells out to `node --check` to parse the
      # JavaScript inside Code nodes. Without node on PATH that check is
      # skipped silently, so this step is load-bearing, not boilerplate.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: pip install pglast

      # The old version globbed workflows/*.json, which is 50 of 326 —
      # every dashboard webhook under workflows/api/ went unchecked.
      - name: Parse every workflow JSON
        run: |
          count=0
          failed=0
          while IFS= read -r file; do
            count=$((count + 1))
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$file"; then
              echo "::error file=$file::invalid JSON"
              failed=$((failed + 1))
            fi
          done < <(find workflows -name '*.json' -type f | sort)

          echo "Parsed $count workflow JSON files, $failed invalid"
          if [ "$count" -eq 0 ]; then
            echo "::error::no workflow JSON files found — the find path is wrong"
            exit 1
          fi
          [ "$failed" -eq 0 ] || exit 1

      - name: Check required workflow files exist
        run: |
          required_files=(
            "workflows/clx-lead-import.json"
            "workflows/clx-lead-research-v2.json"
            "workflows/clx-lead-scoring-v2.json"
            "workflows/clx-business-signal-detection-v2.json"
            "workflows/clx-campaign-router-v2.json"
            "workflows/clx-outreach-generation-v2.json"
            "workflows/clx-outreach-sender-v2.json"
            "workflows/clx-follow-up-v2.json"
            "workflows/clx-booking-v2.json"
            "workflows/clx-pipeline-update-v2.json"
            "workflows/clx-reply-ingestion-v1.json"
            "workflows/clx-email-scraper-v3.json"
            "workflows/clx-b2c-discovery-v2.1.json"
            "workflows/clx-city-scan-discovery.json"
            "workflows/clx-mcp-tool-gateway.json"
          )
          failed=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::required workflow file is missing"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      # Dangling connections, $('Node') references to nodes that do not
      # exist, credentials carrying an id, duplicate webhook paths and
      # workflow ids, Code nodes that do not parse, $input.all() under
      # runOnceForEachItem. Every one of these has bitten this repo.
      - name: Validate workflows
        run: python3 scripts/validate-workflows.py

      # The agent policy gate is the only thing standing between an agent's
      # decision and a real message, payment or deletion. It is a Code node,
      # so this test extracts the shipped jsCode from the workflow and runs it
      # against synthetic inputs -- testing what deploys, not a copy of it.
      - name: Test agent policy gate (fail-closed)
        run: node tests/agent/policy-gate.test.js

      # Why Now and Next Best Action decide whether a human gets contacted and
      # on what evidence. The guarantee worth protecting is that a failure in
      # our own pipeline never comes back as intent about the prospect -- 284
      # rows were exactly that bug before it was fixed.
      - name: Test Why Now and Next Best Action
        run: node tests/agent/why-now-nba.test.js

      # The capability-selection stage lets the agent look something up
      # before recommending. Every property tested here is a refusal: an
      # unknown tool, prose instead of JSON, or a reach for a different
      # lead must all end in NO tool call rather than a guess.
      - name: Test agent capability selection
        run: node tests/agent/capability-selection.test.js

      # Three action vocabularies were live at once and no send could
      # complete: the engine emitted send_email, the registry keyed on
      # email, and the Switch routed on send_email. Both halves refused for
      # the wrong reason, which looked like safety and was two bugs
      # cancelling out. This fails if they drift apart again.
      - name: Test canonical action taxonomy
        run: node tests/agent/action-taxonomy.test.js

      # Promotion is where a scored lead becomes one we intend to write a
      # message for. Three incidents came from a stage trusting the previous
      # stage's label instead of re-deriving the facts; this proves every
      # missing fact refuses, and that qualifying a lead never authorises
      # contacting it.
      - name: Test promotion eligibility gate
        run: node tests/agent/promotion-gate.test.js

      # MCP must not be the shorter path to a real send. This proves the
      # five contact-a-human tools hand over to agent/action-execute and
      # that no MCP node calls a deterministic sender directly.
      - name: Test MCP context gate (no policy bypass)
        run: node tests/agent/mcp-context-gate.test.js

      # Real Postgres grammar via libpg_query, across both migration
      # directories. Mary pastes these into the Supabase SQL editor by
      # hand, where a syntax error surfaces halfway through a
      # partially-applied file.
      - name: Validate migrations
        run: |
          shopt -s nullglob
          files=(db/migrations/*.sql docs/architecture/migrations/*.sql)
          echo "Validating ${#files[@]} SQL files"
          python3 scripts/validate-migrations.py "${files[@]}"

  # ── Job 2: Deploy ───────────────────────────────────────────────
  deploy:
    name: Update changed workflows in n8n
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine which workflows changed
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.files }}" ]; then
            for f in ${{ github.event.inputs.files }}; do echo "$f"; done | sed '/^$/d' | sort > changed.txt
            echo "Manual dispatch: deploying an explicit file list"
          elif [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            find workflows -name '*.json' -type f | sort > changed.txt
            echo "Manual dispatch: updating the whole estate"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=d "${{ github.event.before }}" "${{ github.sha }}" -- 'workflows/*.json' 'workflows/**/*.json' | sort > changed.txt
          else
            # First push on a branch, or a force push — no usable base.
            # Deploy nothing rather than guess; ship.sh remains available.
            : > changed.txt
            echo "::warning::no comparable base commit; skipping deploy"
          fi
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ ! -s changed.txt ]; then
            echo "::error::Manual dispatch selected no workflows. Pass files=<paths> or set deploy_all=true. A dispatch that deploys nothing is not a success."
            exit 1
          fi
          echo "Changed workflow files: $(wc -l < changed.txt)"
          cat changed.txt

      - name: Update workflows in n8n
        if: steps.changed.outputs.count != '0'
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          ALLOW_PROTECTED: ${{ github.event.inputs.allow_protected }}
        run: |
          set -uo pipefail

          if [ -z "${N8N_URL:-}" ] || [ -z "${N8N_API_KEY:-}" ]; then
            echo "::error::N8N_URL / N8N_API_KEY are not configured — cannot deploy"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          N8N_URL="${N8N_URL%/}"

          # Fail fast and loudly on a dead key. The previous version of
          # this file swallowed every failure with `|| true` and then
          # printed "Deployed successfully" regardless, which is how a
          # 401-ing API key went unnoticed for months.
          probe=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X GET "$N8N_URL/api/v1/workflows?limit=1" \
            -H "X-N8N-API-KEY: $N8N_API_KEY")
          if [ "$probe" != "200" ]; then
            echo "::error::n8n API rejected the key (HTTP $probe) — nothing deployed."
            echo "Mint a new key in n8n -> Settings -> API, then update the N8N_API_KEY secret."
            exit 1
          fi
          echo "n8n API reachable, key accepted."

          # The 9 protected production workflows (CLAUDE.md working
          # agreement). Never touched by an automatic push; a manual
          # dispatch must opt in explicitly.
          protected="clx-lead-import.json clx-lead-research-v2.json clx-lead-scoring-v2.json clx-campaign-router-v2.json clx-outreach-generation-v2.json clx-outreach-sender-v2.json clx-pipeline-update-v2.json clx-reply-ingestion-v1.json clx-booking-v2.json"

          updated=0; skipped=0; absent=0; failed=0; guarded=0

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            base=$(basename "$file")

            case " $protected " in
              *" $base "*)
                if [ "${ALLOW_PROTECTED:-false}" != "true" ]; then
                  echo "::warning file=$file::protected production workflow — not deployed"
                  guarded=$((guarded + 1))
                  continue
                fi
                ;;
            esac

            wf_id=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print(d.get('id') or '')" "$file")

            if [ -z "$wf_id" ]; then
              echo "::warning file=$file::no top-level id — cannot update by id, skipped"
              skipped=$((skipped + 1))
              continue
            fi

            exists=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -X GET "$N8N_URL/api/v1/workflows/$wf_id" \
              -H "X-N8N-API-KEY: $N8N_API_KEY")

            if [ "$exists" != "200" ]; then
              echo "::warning file=$file::not in n8n (id $wf_id, HTTP $exists) — first import is a ship.sh action"
              absent=$((absent + 1))
              continue
            fi

            # n8n's REST API rejects settings keys its own UI exports.
            # One implementation of that whitelist, shared with ship.sh.
            if ! python3 scripts/n8n/n8n-put-body.py "$file" > body.json; then
              echo "::error file=$file::could not build a PUT body"
              failed=$((failed + 1))
              continue
            fi

            code=$(curl -s -o resp.json -w '%{http_code}' --max-time 60 \
              -X PUT "$N8N_URL/api/v1/workflows/$wf_id" \
              -H "X-N8N-API-KEY: $N8N_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @body.json)

            if [ "$code" = "200" ]; then
              echo "updated $base ($wf_id)"
              updated=$((updated + 1))
            else
              echo "::error file=$file::PUT returned HTTP $code — $(head -c 300 resp.json)"
              failed=$((failed + 1))
            fi
          done < changed.txt

          {
            echo "## Crystallux deploy"
            echo ""
            echo "| Result | Count |"
            echo "|---|---:|"
            echo "| Updated in n8n | $updated |"
            echo "| Protected, not deployed | $guarded |"
            echo "| Not yet in n8n (needs ship.sh) | $absent |"
            echo "| Skipped, no id | $skipped |"
            echo "| **Failed** | **$failed** |"
            echo ""
            echo "Activation state is untouched — deploys never activate."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed workflow update(s) failed"
            exit 1
          fi
          echo "Deploy complete: $updated updated, $guarded protected, $absent absent."
